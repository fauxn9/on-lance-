[package]
name = "agent-core"
version = "0.1.1"
edition = "2021"
license = "MIT"

[dependencies]
presence-core = { path = "../presence-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["time", "rt", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
