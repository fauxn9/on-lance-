<style>
  .shell { width: min(100% - 32px, 760px); }
  h1 { font-size: clamp(25px, 5vw, 32px); font-weight: 800; margin-top: 6px; }

  /* Bandeau d'etat : semaine en cours, compte a rebours, rafraichissement */
  .status {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 12px; margin-top: 16px;
    padding: 13px 16px; border: 1px solid var(--line); border-radius: 13px; background: var(--lift);
  }
  .status-left { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .status-left strong { font-family: var(--display); font-size: 14.5px; }
  .countdown { font-family: var(--mono); font-size: 12.5px; color: var(--faint); }
  .countdown b { color: var(--warm); font-weight: 700; }
  .status button { padding: 10px 16px; font-size: 13.5px; white-space: nowrap; }

  @media (max-width: 520px) {
    .status { flex-direction: column; align-items: stretch; }
    .status button { width: 100%; }
  }

  /* Selecteur de groupe : n'apparait que si on appartient a plusieurs groupes */
  .grouppick { margin-top: 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .grouppick select {
    padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: #14141d; color: var(--ink); font-family: var(--body); font-size: 13.5px;
  }

  section { padding: 30px 0; border-top: 1px solid var(--line-soft); }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .section-head h2 { font-size: 19px; font-weight: 800; }

  /* --- Classement ---------------------------------------------------------- */

  .rows { display: flex; flex-direction: column; gap: 8px; }

  .row {
    display: grid; grid-template-columns: 34px minmax(0,1fr) auto auto;
    align-items: center; gap: 14px;
    padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--lift);
    transition: background .4s ease, border-color .4s ease;
  }
  .row--lead {
    border-color: rgba(255,70,85,.35);
    background: linear-gradient(90deg, rgba(255,70,85,.09), var(--lift) 60%);
  }
  /* Flash quand une ligne change apres un rafraichissement */
  .row--moved { background: rgba(79,227,176,.1); border-color: rgba(79,227,176,.35); }
  /* Sa propre ligne, pour se retrouver d'un coup d'oeil */
  .row--me { box-shadow: inset 3px 0 0 var(--cool); }

  .pos {
    font-family: var(--mono); font-size: 15px; font-weight: 700; color: var(--faint);
    text-align: center; font-variant-numeric: tabular-nums;
  }
  .row--lead .pos { color: var(--gold); }

  .whom { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .name { font-family: var(--display); font-weight: 700; font-size: 15.5px; }
  .meta { font-family: var(--mono); font-size: 11.5px; color: var(--faint); }

  .delta {
    font-family: var(--mono); font-size: 11.5px; font-weight: 700;
    padding: 3px 8px; border-radius: 999px; white-space: nowrap;
  }
  .delta--up { background: rgba(79,227,176,.14); color: var(--gain); }

  .rr {
    font-family: var(--mono); font-size: 18px; font-weight: 700;
    text-align: right; min-width: 62px; font-variant-numeric: tabular-nums;
  }
  .up { color: var(--gain); } .down { color: var(--loss); } .flat { color: var(--faint); }

  @media (max-width: 480px) {
    .row { grid-template-columns: 28px minmax(0,1fr) auto; gap: 10px; padding: 12px 13px; }
    .delta { grid-column: 2; justify-self: start; }
    .rr { font-size: 17px; min-width: 54px; }
  }

  /* --- Historique ---------------------------------------------------------- */

  .past { display: flex; flex-direction: column; gap: 7px; }
  .past-row {
    display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: center; gap: 14px;
    padding: 12px 15px; border: 1px solid var(--line-soft); border-radius: 11px;
  }
  .past-week { font-size: 13.5px; color: var(--muted); }
  .past-winner { font-family: var(--display); font-weight: 700; font-size: 14.5px; }
  .past-winner .crown { margin-right: 6px; }
  .past-rr { font-family: var(--mono); font-size: 13.5px; font-weight: 700; font-variant-numeric: tabular-nums; }

  .error { border: 1px solid rgba(255,70,85,.3); color: var(--accent); border-radius: 12px; padding: 18px; font-size: 14px; }
</style>

<div class="shell">
  <header class="head" id="head"></header>

  <span class="eyebrow" id="groupName">Classement</span>
  <h1 id="weekLabel">Chargement…</h1>

  <div class="grouppick" id="pick" hidden>
    <label for="grp" style="margin:0">Groupe</label>
    <select id="grp"></select>
  </div>

  <div class="status" id="status" hidden>
    <div class="status-left">
      <strong id="statusTitle">Semaine en cours</strong>
      <span class="countdown" id="countdown"></span>
    </div>
    <button id="refresh">Rafraîchir</button>
  </div>

  <div class="note" id="noGroup" hidden></div>

  <main id="main" hidden>
    <section style="border-top:0;padding-top:22px">
      <div class="rows" id="rows"></div>
    </section>

    <section>
      <div class="section-head">
        <h2>Semaines passées</h2>
        <span class="eyebrow">Tableau d'honneur</span>
      </div>
      <div class="past" id="past"></div>
    </section>
  </main>

  <footer>
    Le classement compte le RR gagné sur la semaine. Remise à zéro chaque lundi à
    minuit, heure de Paris — le vainqueur reste au tableau d'honneur.
  </footer>
</div>

<script type="module">
  import { api, requireUser, renderHeader, signed, esc, $ } from '/app.js';

  let groupId = null;
  let endsAt = null;
  let previous = new Map(); // userId -> { rank, rrTotal }, pour reperer ce qui a bouge
  let moi = null;

  // --- Compte a rebours jusqu'a la cloture -----------------------------------

  function tick() {
    if (!endsAt) return;
    const ms = endsAt - Date.now();
    if (ms <= 0) {
      $('countdown').innerHTML = 'La semaine est terminée, clôture imminente.';
      return;
    }
    const j = Math.floor(ms / 86400000);
    const h = Math.floor((ms % 86400000) / 3600000);
    const m = Math.floor((ms % 3600000) / 60000);
    $('countdown').innerHTML =
      `Clôture dans <b>${j > 0 ? `${j} j ${h} h` : h > 0 ? `${h} h ${m} min` : `${m} min`}</b>`;
  }
  setInterval(tick, 30000);

  // --- Classement ------------------------------------------------------------

  function render(data) {
    $('weekLabel').textContent = data.label.charAt(0).toUpperCase() + data.label.slice(1);
    $('statusTitle').textContent = data.isCurrentWeek ? 'Semaine en cours' : 'Semaine terminée';
    endsAt = data.endsAt ? new Date(data.endsAt).getTime() : null;
    tick();

    if (data.standings.length === 0) {
      $('rows').innerHTML = `<div class="empty">
        Personne dans ce groupe n'a encore lié son compte Valorant.
      </div>`;
      return;
    }

    $('rows').innerHTML = data.standings.map((s) => {
      const before = previous.get(s.userId);
      const gagne = before && s.rrTotal > before.rrTotal;
      const monte = before && s.rank < before.rank;

      const cls = ['row'];
      if (s.rank === 1 && s.matches > 0) cls.push('row--lead');
      if (gagne) cls.push('row--moved');
      if (moi !== null && Number(s.userId) === Number(moi)) cls.push('row--me');

      return `
        <article class="${cls.join(' ')}">
          <span class="pos">${s.rank}</span>
          <span class="whom">
            <span class="name">${esc(s.displayName)}${s.rank === 1 && s.matches > 0 ? ' 👑' : ''}</span>
            <span class="meta">${s.matches} partie${s.matches > 1 ? 's' : ''}${
              s.bestGain !== null ? ` · meilleur ${signed(s.bestGain)}` : ''
            }</span>
          </span>
          ${monte ? `<span class="delta delta--up">▲ ${before.rank - s.rank}</span>` : '<span></span>'}
          <span class="rr ${s.rrTotal > 0 ? 'up' : s.rrTotal < 0 ? 'down' : 'flat'}">${signed(s.rrTotal)}</span>
        </article>`;
    }).join('');

    previous = new Map(data.standings.map((s) => [s.userId, { rank: s.rank, rrTotal: s.rrTotal }]));
  }

  async function load({ live = false } = {}) {
    const btn = $('refresh');
    btn.disabled = true;
    if (live) btn.textContent = 'Mise à jour…';

    try {
      const data = live
        ? await api(`/groups/${groupId}/leaderboard/refresh`, { method: 'POST' })
        : await api(`/groups/${groupId}/leaderboard`);
      render(data);

      if (live && data.refreshed === false) {
        $('countdown').innerHTML += ' · déjà à jour il y a moins d\'une minute';
      }
    } catch (err) {
      $('rows').innerHTML = `<div class="error">${esc(err.message)}</div>`;
    } finally {
      btn.disabled = false;
      btn.textContent = 'Rafraîchir';
    }
  }

  $('refresh').addEventListener('click', () => load({ live: true }));

  // --- Historique des vainqueurs ---------------------------------------------

  const weekFmt = new Intl.DateTimeFormat('fr-FR', { day: 'numeric', month: 'long', timeZone: 'UTC' });

  async function loadPast() {
    try {
      const rows = await api(`/groups/${groupId}/leaderboard/history`);
      if (rows.length === 0) {
        $('past').innerHTML = `<div class="empty">
          Aucune semaine clôturée pour l'instant. La première clôture a lieu lundi.
        </div>`;
        return;
      }
      $('past').innerHTML = rows.map((r) => `
        <div class="past-row">
          <span class="past-week">Semaine du ${weekFmt.format(new Date(r.week_start))}</span>
          <span class="past-winner">
            <span class="crown">👑</span>${esc(r.winner_name ?? '—')}
            <span class="past-rr ${r.winner_rr > 0 ? 'up' : 'down'}">${
              r.winner_rr === null ? '' : signed(r.winner_rr) + ' RR'
            }</span>
          </span>
        </div>`).join('');
    } catch {
      $('past').innerHTML = '<div class="empty">Historique indisponible.</div>';
    }
  }

  // --- Demarrage -------------------------------------------------------------

  const user = await requireUser();
  if (user) await start(user);

  async function start(user) {
    renderHeader($('head'), user, { active: '/leaderboard.html' });
    moi = user.id;

    // Le groupe vient de l'URL quand on arrive depuis une invitation ou la page
    // groupes ; sinon du dernier consulte sur cet appareil ; sinon le premier.
    const voulu = new URLSearchParams(location.search).get('groupe')
      ?? localStorage.getItem('onlance_group');

    const { groups } = await api('/me/groups');

    if (groups.length === 0) {
      $('weekLabel').textContent = 'Aucun groupe';
      const n = $('noGroup');
      n.dataset.kind = 'info';
      n.hidden = false;
      n.innerHTML = `Tu n'es dans aucun groupe : il n'y a donc pas de classement à
        afficher. Ouvre le lien d'invitation d'un ami, ou
        <a href="/groupes.html">crée ton groupe</a>.`;
      return;
    }

    const choisi = groups.find((g) => String(g.id) === String(voulu)) ?? groups[0];
    appliquer(choisi);

    if (groups.length > 1) {
      $('pick').hidden = false;
      $('grp').innerHTML = groups
        .map((g) => `<option value="${g.id}"${g.id === choisi.id ? ' selected' : ''}></option>`)
        .join('');
      for (const [i, opt] of [...$('grp').options].entries()) opt.textContent = groups[i].name;

      $('grp').addEventListener('change', async () => {
        appliquer(groups.find((g) => String(g.id) === $('grp').value));
        previous = new Map();
        await load();
        await loadPast();
      });
    }

    $('status').hidden = false;
    $('main').hidden = false;

    // Affichage immediat depuis la base, puis mise a jour live : on ne fait pas
    // attendre devant un ecran vide pendant que l'API Valorant repond.
    await load();
    await loadPast();
    load({ live: true });
  }

  function appliquer(g) {
    groupId = g.id;
    $('groupName').textContent = g.name;
    localStorage.setItem('onlance_group', String(g.id));
    history.replaceState(null, '', `/leaderboard.html?groupe=${g.id}`);
  }
</script>
