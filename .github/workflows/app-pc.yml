# Fabrication de l'installateur Windows de l'application PC.
#
# POURQUOI PASSER PAR GITHUB PLUTOT QUE PAR TA MACHINE
#
# Compiler l'application demande Rust et les Build Tools de Visual Studio. Ce
# workflow les a deja : personne n'a besoin de les installer pour DISTRIBUER
# l'app, et l'installateur produit est le meme a chaque fois, quelle que soit
# la machine de celui qui declenche la construction.
#
# COMMENT S'EN SERVIR
#
#   - a la main : onglet Actions -> "Application PC" -> "Run workflow"
#   - ou en poussant une etiquette :  git tag app-v0.1.0 && git push --tags
#
# Dans les deux cas, le .exe se retrouve dans la page Releases du depot, et
# c'est ce lien-la qu'on envoie aux potes.
#
# LA SIGNATURE
#
# Deux signatures differentes, a ne pas confondre :
#
#   - celle de la MISE A JOUR (ce workflow la produit) : elle prouve a une
#     application deja installee que la nouvelle version vient bien de nous.
#     Elle exige le secret TAURI_SIGNING_PRIVATE_KEY.
#   - celle de WINDOWS (on ne l'a pas) : elle ferait disparaitre l'ecran bleu
#     du premier telechargement, et coute plusieurs centaines d'euros par an.
#
# A SAVOIR : l'installateur n'est PAS signe pour Windows. Windows affichera donc un ecran
# bleu "Windows a protege votre ordinateur" au premier lancement — il faut
# cliquer sur "Informations complementaires" puis "Executer quand meme". Faire
# disparaitre cet ecran demande un certificat de signature de code, qui coute
# plusieurs centaines d'euros par an. C'est assume : on previent les potes.

name: Application PC

on:
  workflow_dispatch:
  push:
    tags: ['app-v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      # La compilation de Tauri prend une dizaine de minutes a froid. Le cache
      # ramene les suivantes a deux ou trois.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Dépendances
        working-directory: desktop
        run: npm install

      - name: Construction
        working-directory: desktop
        env:
          # La cle privee de signature. Elle ne vit QUE dans les secrets du
          # depot : elle ne doit apparaitre ni dans le code, ni dans un
          # fichier, ni dans un message. C'est elle qui autorise une mise a
          # jour a s'installer sur les PC des potes.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build

      # Le nom du fichier contient la version : on le retrouve plutot que de
      # l'ecrire en dur, sinon chaque montee de version casserait ce workflow.
      - name: Retrouver l'installateur
        id: exe
        shell: pwsh
        run: |
          $nsis = "desktop/src-tauri/target/release/bundle/nsis"
          $exe = Get-ChildItem -Recurse -Filter *.exe -Path $nsis | Select-Object -First 1
          if (-not $exe) { throw "Aucun installateur produit." }
          echo "chemin=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          echo "nom=$($exe.Name)" >> $env:GITHUB_OUTPUT

          # La signature accompagne l'installateur. Son absence veut dire que
          # le secret de signature manque : on s'arrete plutot que de publier
          # une version que personne ne pourra installer automatiquement.
          $sig = Get-ChildItem -Recurse -Filter *.exe.sig -Path $nsis | Select-Object -First 1
          if (-not $sig) {
            throw "Aucune signature produite. Le secret TAURI_SIGNING_PRIVATE_KEY est-il bien defini ?"
          }
          # Les retours a la ligne sont retires : une sortie d'etape sur
          # plusieurs lignes casse GITHUB_OUTPUT, et la signature en contient
          # au moins un en fin de fichier.
          $valeur = (Get-Content $sig.FullName -Raw) -replace "`r?`n", ""
          echo "signature=$valeur" >> $env:GITHUB_OUTPUT

      # Toujours disponible, meme sans etiquette : utile pour tester une
      # construction sans publier de version.
      - uses: actions/upload-artifact@v4
        with:
          name: installateur-windows
          path: ${{ steps.exe.outputs.chemin }}

      # Le fichier que les applications installees vont lire pour savoir
      # qu'une version existe. Son URL est figee dans tauri.conf.json et pointe
      # sur la DERNIERE version : c'est GitHub qui redirige, on n'a rien a
      # heberger.
      - name: Écrire latest.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^app-v', ''
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.exe.outputs.nom }}"
          $manifeste = @{
            version = $version
            notes = "Mise a jour d'On lance ?"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = "${{ steps.exe.outputs.signature }}".Trim()

                url = $url
              }
            }
          }
          $manifeste | ConvertTo-Json -Depth 5 | Set-Content latest.json -Encoding utf8
          Get-Content latest.json

      - name: Publier la version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $notes = @"
          Application PC d'On lance ?

          **Installation** — telecharge le .exe, lance-le. Windows affichera
          "Windows a protege votre ordinateur" : clique sur *Informations
          complementaires* puis *Executer quand meme*. C'est normal,
          l'installateur n'est pas signe (un certificat coute plusieurs
          centaines d'euros par an).

          Aucun droit administrateur necessaire, et un raccourci est cree sur
          le bureau.

          **Premier lancement** — l'app demande un code a six caracteres.
          Il s'affiche sur onlance.xyz, tableau de bord, bloc *Application PC*.

          **Ce qu'elle fait** — elle lit l'etat de partie que le client Riot
          expose en local, en lecture seule, et le remonte au site : fin de
          partie detectee a la seconde, debrief qui s'ouvre tout seul,
          classement et coach dans la fenetre.
          "@
          gh release create ${{ github.ref_name }} `
            "${{ steps.exe.outputs.chemin }}" latest.json `
            --title "Application PC ${{ github.ref_name }}" --notes $notes
