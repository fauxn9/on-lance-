# Blueprint Render — onlance.xyz
#
# Même service web que l'ancien tracker Valorant (même nom, mêmes commandes) :
# le domaine reste branché dessus, rien à toucher dans le dashboard.
# Les crons Valorant ont été retirés : le projet est abandonné.

services:
  - type: web
    name: on-lance-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
